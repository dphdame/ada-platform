[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-platform"
version = "0.1.0"
description = "Document accessibility platform for DOCX, PPTX, and PDF"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "click>=8.1",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[project.scripts]
ada-platform = "ada_platform.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
